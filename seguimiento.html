<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1117">
<title>Seguí tu pedido · k24hs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--red:#CC0000;--bg:#0d1117;--panel:#161b22;--line:#262d38;
        --txt:#e6edf3;--muted:#8b949e;--ok:#22c55e;--warn:#e5a000}
  body{font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  .logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:30px;text-align:center;margin-bottom:2px}
  .logo span{color:var(--red)}
  .sub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:3px;
       text-transform:uppercase;margin-bottom:22px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:15px}
  .cod{font-family:Rajdhani,sans-serif;font-weight:700;font-size:15px;color:var(--muted);
       letter-spacing:1px;text-align:center}
  .estado{font-family:Rajdhani,sans-serif;font-weight:700;font-size:27px;text-align:center;
          margin:6px 0 4px;line-height:1.2}
  .detalle{text-align:center;color:var(--muted);font-size:14px;line-height:1.5}

  .pasos{display:flex;justify-content:space-between;margin:26px 0 8px;position:relative}
  .pasos::before{content:'';position:absolute;top:13px;left:12%;right:12%;height:2px;background:var(--line)}
  .paso{position:relative;text-align:center;flex:1;z-index:1}
  .bola{width:27px;height:27px;border-radius:50%;background:var(--bg);border:2px solid var(--line);
        margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-size:13px}
  .paso.hecho .bola{background:var(--ok);border-color:var(--ok)}
  .paso.actual .bola{background:var(--red);border-color:var(--red);animation:lat 1.6s infinite}
  @keyframes lat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  .paso small{font-size:10.5px;color:var(--muted);letter-spacing:.3px}
  .paso.hecho small,.paso.actual small{color:var(--txt)}

  #mapa{height:280px;border-radius:12px;overflow:hidden;margin-bottom:15px;display:none;border:1px solid var(--line)}
  .leaflet-container{background:#0d1117}
  .pin-moto{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

  .fila{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
  .fila:last-child{border:none} .fila span:first-child{color:var(--muted)}
  .tot{font-family:Rajdhani,sans-serif;font-weight:700;font-size:19px;padding-top:12px}
  h3{font-family:Rajdhani,sans-serif;font-size:12px;text-transform:uppercase;
     letter-spacing:2px;color:var(--muted);margin-bottom:12px}
  .cargando,.error{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.7}
  .btn{display:block;width:100%;background:var(--red);color:#fff;text-align:center;
       text-decoration:none;font-family:Rajdhani,sans-serif;font-weight:700;font-size:16px;
       padding:15px;border-radius:11px;margin-top:6px}
  .frescura{text-align:center;font-size:11.5px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">K<span>24</span></div>
  <div class="sub">Seguí tu pedido</div>
  <div id="cont"><div class="cargando">Buscando tu pedido…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';

var token = new URLSearchParams(location.search).get('t') || '';
var mapa = null, marcador = null, timer = null;

var PASOS = [
  { id:'confirmado', icono:'✓', txt:'Confirmado' },
  { id:'preparando', icono:'📦', txt:'Preparando' },
  { id:'en_camino',  icono:'🛵', txt:'En camino' },
  { id:'entregado',  icono:'🏠', txt:'Entregado' }
];

var TITULO = {
  nuevo:      'Recibimos tu pedido',
  confirmado: 'Pedido confirmado',
  preparando: 'Estamos armando tu pedido',
  asignado:   'Listo para salir',
  en_camino:  'Tu pedido va en camino',
  entregado:  '¡Entregado!',
  cancelado:  'Pedido cancelado'
};
var BAJADA = {
  nuevo:      'En un momento lo confirmamos.',
  confirmado: 'Ya lo estamos preparando.',
  preparando: 'Falta poco para que salga.',
  asignado:   'El repartidor lo está por retirar.',
  en_camino:  'Podés seguirlo en el mapa.',
  entregado:  'Gracias por comprar en k24hs.',
  cancelado:  'Si tenés dudas, escribinos por WhatsApp.'
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pesos(n){ return '$' + (Number(n)||0).toLocaleString('es-AR'); }

async function cargar(){
  if (!token){ return fallo('Link inválido', 'Falta el código de seguimiento.'); }
  try{
    var r = await fetch('/api/despacho/seguimiento?t=' + encodeURIComponent(token));
    var d = await r.json();
    if (!r.ok || !d.ok) return fallo('No encontramos tu pedido', 'Revisá el link que te enviamos.');
    pintar(d.pedido);
  }catch(e){
    fallo('No pudimos conectarnos', 'Probá de nuevo en unos segundos.');
  }
}

function fallo(tit, txt){
  clearInterval(timer);
  document.getElementById('cont').innerHTML =
    '<div class="error"><b style="color:#e6edf3;font-size:17px">' + esc(tit) + '</b><br>' + esc(txt) +
    '<br><br><a class="btn" href="/">Volver al kiosco</a></div>';
}

function pintar(p){
  var terminado = p.estado === 'entregado' || p.estado === 'cancelado';
  var idx = PASOS.findIndex(function(s){ return s.id === p.estado; });
  // "nuevo" y "asignado" no tienen paso propio: se muestran como el anterior
  if (p.estado === 'nuevo') idx = -1;
  if (p.estado === 'asignado') idx = 1;

  var h = '<div class="card">';
  h += '<div class="cod">' + esc(p.codigo) + '</div>';
  h += '<div class="estado">' + esc(TITULO[p.estado] || p.estado) + '</div>';
  h += '<div class="detalle">' + esc(BAJADA[p.estado] || '') + '</div>';

  if (p.estado !== 'cancelado'){
    h += '<div class="pasos">';
    PASOS.forEach(function(s, i){
      var cl = i < idx ? 'hecho' : (i === idx ? 'actual' : '');
      if (p.estado === 'entregado') cl = 'hecho';
      h += '<div class="paso ' + cl + '"><div class="bola">' + s.icono + '</div><small>' + s.txt + '</small></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div id="mapa"></div>';
  if (p.posicion) {
    h += '<div class="frescura" id="fresco"></div>';
  }

  h += '<div class="card"><h3>Tu pedido</h3>';
  (p.items || []).forEach(function(i){
    h += '<div class="fila"><span>' + i.qty + '× ' + esc(i.nombre) + '</span></div>';
  });
  h += '<div class="fila"><span>Envío</span><span>' + (p.envio ? pesos(p.envio) : 'gratis') + '</span></div>';
  h += '<div class="fila tot"><span>Total</span><span>' + pesos(p.total) + '</span></div>';
  h += '</div>';

  h += '<div class="card"><h3>Entrega</h3>';
  h += '<div class="fila"><span>Dirección</span><span style="text-align:right;max-width:60%">' + esc(p.direccion) + '</span></div>';
  if (p.repartidor) h += '<div class="fila"><span>Repartidor</span><span>' + esc(p.repartidor.nombre) + '</span></div>';
  if (p.metodo_pago) h += '<div class="fila"><span>Pago</span><span>' + esc(p.metodo_pago) + '</span></div>';
  h += '</div>';

  h += '<a class="btn" href="/">Volver al kiosco</a>';

  document.getElementById('cont').innerHTML = h;

  if (p.posicion) {
    document.getElementById('fresco').textContent =
      'Ubicación de hace ' + (p.posicion.hace_segundos < 60
        ? p.posicion.hace_segundos + ' segundos'
        : Math.round(p.posicion.hace_segundos/60) + ' minutos');
    dibujarMapa(p.posicion);
  }

  if (terminado) clearInterval(timer);
}

function dibujarMapa(pos){
  var div = document.getElementById('mapa');
  if (!div || typeof L === 'undefined') return;
  div.style.display = 'block';

  if (!mapa){
    mapa = L.map(div, { zoomControl:false, attributionControl:false }).setView([pos.lat, pos.lng], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(mapa);
    L.control.attribution({ prefix:false, position:'bottomright' })
      .addAttribution('&copy; OSM &copy; CARTO').addTo(mapa);
    marcador = L.marker([pos.lat, pos.lng], {
      icon: L.divIcon({ className:'', html:'<div class="pin-moto">🛵</div>', iconSize:[30,30], iconAnchor:[15,15] })
    }).addTo(mapa);
  } else {
    marcador.setLatLng([pos.lat, pos.lng]);
    mapa.panTo([pos.lat, pos.lng]);
  }
  // Leaflet a veces calcula mal el tamano si el div recien se mostro
  setTimeout(function(){ mapa.invalidateSize(); }, 120);
}

cargar();
timer = setInterval(cargar, 15000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) cargar(); });
</script>
</body>
</html>
