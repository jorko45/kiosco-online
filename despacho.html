<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>K24 · Despacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --red:#CC0000; --red-d:#a30000; --bg:#0d1117; --panel:#161b22;
    --line:#262d38; --txt:#e6edf3; --muted:#8b949e;
    --nuevo:#e5a000; --confirmado:#3b82f6; --preparando:#8b5cf6;
    --asignado:#06b6d4; --camino:#22c55e; --ok:#16a34a; --mal:#ef4444;
  }
  body{font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  h1,h2,h3,.tit{font-family:Rajdhani,sans-serif;letter-spacing:.5px}

  /* ── LOGIN ── */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .caja{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;width:100%;max-width:360px}
  .logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:34px;text-align:center;margin-bottom:4px}
  .logo span{color:var(--red)}
  .sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:26px}
  input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:9px;
    padding:12px;color:var(--txt);font-family:Inter,sans-serif;font-size:15px}
  input:focus,select:focus{outline:none;border-color:var(--red)}
  .btn{width:100%;background:var(--red);border:none;color:#fff;font-family:Rajdhani,sans-serif;
    font-weight:700;font-size:16px;letter-spacing:1px;padding:13px;border-radius:9px;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--red-d)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-s{padding:7px 12px;font-size:13px;width:auto;border-radius:7px}
  .btn-g{background:#21262d;border:1px solid var(--line)} .btn-g:hover{background:#2d333b}
  .err{color:var(--mal);font-size:13px;margin-top:12px;text-align:center;min-height:18px}

  /* ── APP ── */
  #app{display:none}
  header{background:var(--panel);border-bottom:2px solid var(--red);position:sticky;top:0;z-index:50}
  .hd{max-width:1600px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .hd .logo{font-size:24px;margin:0}
  .stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
  .stat{text-align:center}
  .stat b{display:block;font-family:Rajdhani,sans-serif;font-size:21px;line-height:1}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .vivo{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:lat 2s infinite}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}

  main{max-width:1600px;margin:0 auto;padding:20px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .col>h2{padding:11px 15px;font-size:13px;text-transform:uppercase;letter-spacing:2px;
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .col>h2 i{font-style:normal;background:#0d1117;padding:1px 8px;border-radius:10px;font-size:12px}
  .col-body{padding:11px;display:flex;flex-direction:column;gap:11px;min-height:70px;max-height:calc(100vh - 220px);overflow-y:auto}
  .vacio{color:var(--muted);font-size:13px;text-align:center;padding:22px 0}

  .ped{background:#0d1117;border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:12px;font-size:13.5px}
  .ped.e-nuevo{border-left-color:var(--nuevo)} .ped.e-confirmado{border-left-color:var(--confirmado)}
  .ped.e-preparando{border-left-color:var(--preparando)} .ped.e-asignado{border-left-color:var(--asignado)}
  .ped.e-en_camino{border-left-color:var(--camino)}
  .ped.nuevo-flash{animation:flash 1.4s ease-out 3}
  @keyframes flash{0%,100%{background:#0d1117}50%{background:#2a1f00}}
  .ped-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .cod{font-family:Rajdhani,sans-serif;font-weight:700;font-size:16px}
  .tiempo{font-size:11px;color:var(--muted)} .tiempo.alerta{color:var(--nuevo);font-weight:600}
  .tiempo.grave{color:var(--mal);font-weight:700}
  .dir{color:var(--txt);margin-bottom:3px;line-height:1.35}
  .meta{color:var(--muted);font-size:12px;margin-bottom:8px;line-height:1.5}
  .items{background:#161b22;border-radius:6px;padding:8px;margin-bottom:9px;font-size:12.5px;color:#c9d1d9;max-height:110px;overflow-y:auto}
  .items div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
  .tot{display:flex;justify-content:space-between;font-family:Rajdhani,sans-serif;font-weight:700;font-size:15px;margin-bottom:10px}
  .pago{font-size:11px;padding:2px 7px;border-radius:9px;background:#21262d;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .pago.ok{background:#0d3a1e;color:#4ade80}
  .acc{display:flex;gap:6px;flex-wrap:wrap}
  .acc select{width:auto;flex:1;min-width:110px;padding:7px;font-size:13px}
  .rep-tag{display:inline-block;background:#0b2b33;color:#22d3ee;padding:2px 8px;border-radius:9px;font-size:11.5px;margin-bottom:7px}
  .punto-tag{display:inline-block;background:#2b1a3d;color:#c4a1ff;padding:2px 8px;border-radius:9px;font-size:11.5px;margin-bottom:7px;margin-right:5px}
  .sin-ubicar{display:inline-block;background:#3d2800;color:#f5c469;padding:2px 8px;border-radius:9px;font-size:11px;margin-bottom:7px}
  .sug{font-size:11.5px;color:var(--muted);margin:-3px 0 8px}
  .sug b{color:#c4a1ff}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;
    justify-content:center;z-index:150;padding:20px}
  .modal.ver{display:flex}
  .modal-caja{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
  .modal-caja h3{font-size:15px;margin-bottom:14px;letter-spacing:1px}
  .modal-caja label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .modal-caja input,.modal-caja select{margin-bottom:2px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lista-copiar{background:#0d1117;border:1px solid var(--line);border-radius:9px;padding:12px;
    font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre-wrap;
    max-height:300px;overflow-y:auto;margin-bottom:12px}
  .tabla-p{width:100%;font-size:13px;border-collapse:collapse}
  .tabla-p th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:1px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .tabla-p td{padding:7px 4px;border-bottom:1px solid var(--line)}
  .luz-p{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3d444d;margin-right:6px}
  .luz-p.on{background:var(--ok)}

  .side{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .side h3{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:11px}
  .reps{display:flex;gap:10px;flex-wrap:wrap}
  .rep{background:#0d1117;border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px;display:flex;align-items:center;gap:9px}
  .rep .luz{width:8px;height:8px;border-radius:50%;background:#3d444d}
  .rep.turno .luz{background:var(--ok)}
  .rep small{color:var(--muted);font-size:11px}

  .aviso{background:#3d2800;border:1px solid #7a5200;color:#f5c469;padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:16px;line-height:1.5}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#21262d;
    border:1px solid var(--line);border-left:3px solid var(--red);padding:12px 20px;border-radius:9px;
    font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
  .toast.ver{opacity:1}
  @media(max-width:640px){ .hd{gap:12px} .stats{gap:14px} .col-body{max-height:none} }
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login">
  <div class="caja">
    <div class="logo">K<span>24</span></div>
    <div class="sub">Panel de despacho</div>
    <form id="fLogin">
      <input id="clave" type="password" placeholder="Clave del panel" autocomplete="current-password" required>
      <div class="err" id="errLogin"></div>
      <button class="btn" type="submit" id="btnLogin">Entrar</button>
    </form>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <header>
    <div class="hd">
      <div class="logo">K<span>24</span></div>
      <div class="vivo"><span class="dot"></span><span id="lat">conectando…</span></div>
      <div class="stats">
        <div class="stat"><b id="sCola">0</b><span>en cola</span></div>
        <div class="stat"><b id="sHoy">0</b><span>hoy</span></div>
        <div class="stat"><b id="sEnt">0</b><span>entregados</span></div>
        <div class="stat"><b id="sFac">$0</b><span>facturado</span></div>
        <button class="btn btn-g btn-s" id="btnSonido" title="Alerta sonora">🔔</button>
        <button class="btn btn-g btn-s" id="btnSalir">Salir</button>
      </div>
    </div>
  </header>

  <main>
    <div id="aviso"></div>
    <div class="cols" id="cols"></div>
    <div class="side">
      <h3>Repartidores</h3>
      <div class="reps" id="reps"></div>
    </div>

    <div class="side">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        <span>Puntos de preparación</span>
        <button class="btn btn-g btn-s" id="btnNuevoPunto">+ Agregar</button>
      </h3>
      <div id="puntos"></div>
    </div>
  </main>
</div>

<!-- ── Modal: lista para pasarle a la sucursal ── -->
<div class="modal" id="mLista">
  <div class="modal-caja">
    <h3>Lista para pedir</h3>
    <div class="lista-copiar" id="listaTexto"></div>
    <div class="fila" style="display:flex;gap:8px">
      <button class="btn" id="btnCopiar">Copiar</button>
      <button class="btn btn-g" id="btnWspNodo">Enviar por WhatsApp</button>
      <button class="btn btn-g" onclick="cerrarModal('mLista')">Cerrar</button>
    </div>
  </div>
</div>

<!-- ── Modal: alta y edición de punto ── -->
<div class="modal" id="mPunto">
  <div class="modal-caja">
    <h3 id="tituloPunto">Nuevo punto de preparación</h3>
    <label>Nombre</label>
    <input id="pNombre" placeholder="Mami Nueva Córdoba">
    <label>Tipo</label>
    <select id="pTipo">
      <option value="mami">Sucursal Mami</option>
      <option value="kiosco_adherido">Kiosco adherido</option>
      <option value="propio">Local propio</option>
    </select>
    <label>Dirección (la ubicamos sola)</label>
    <input id="pDir" placeholder="Bv. Chacabuco 500">

    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer">
      <input type="checkbox" id="p24" style="width:auto;margin:0">
      <span style="color:var(--txt);font-size:14px">Abierto las 24 horas</span>
    </label>
    <div class="dos" id="horarioNormal">
      <div><label>Abre</label><input id="pDesde" type="time" value="08:00"></div>
      <div><label>Cierra</label><input id="pHasta" type="time" value="21:00"></div>
    </div>
    <div class="sug" id="avisoHorario"></div>

    <div class="dos">
      <div><label>Radio que cubre (km)</label><input id="pRadio" type="number" step="0.5" value="5"></div>
      <div><label>Teléfono</label><input id="pTel" placeholder="351..."></div>
    </div>
    <div class="err" id="errPunto"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn" id="btnGuardarPunto">Guardar</button>
      <button class="btn btn-g" onclick="cerrarModal('mPunto')">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── estado ────────────────────────────────────────────────────────
var TOKEN = sessionStorage.getItem('k24_despacho_token') || null;
var sonido = localStorage.getItem('k24_despacho_sonido') !== '0';
var conocidos = new Set();          // ids ya vistos, para detectar los nuevos
var primeraCarga = true;
var timer = null;

var ESTADOS = [
  { id:'nuevo',      tit:'Nuevos',      sig:['confirmado'] },
  { id:'confirmado', tit:'Confirmados', sig:['preparando'] },
  { id:'preparando', tit:'Preparando',  sig:[] },
  { id:'asignado',   tit:'Asignados',   sig:['en_camino'] },
  { id:'en_camino',  tit:'En camino',   sig:['entregado'] }
];
var NOMBRE = { nuevo:'Nuevo', confirmado:'Confirmado', preparando:'Preparando',
               asignado:'Asignado', en_camino:'En camino', entregado:'Entregado', cancelado:'Cancelado' };

// ── utilidades ────────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pesos(n){ return '$' + (Number(n)||0).toLocaleString('es-AR'); }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('ver');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('ver'); }, 3200);
}
function minutos(seg){
  var m = Math.floor(seg/60);
  if (m < 60) return m + ' min';
  return Math.floor(m/60) + 'h ' + (m%60) + 'm';
}

async function api(ruta, opciones){
  opciones = opciones || {};
  var r = await fetch('/api/despacho/' + ruta, {
    method: opciones.method || 'GET',
    headers: Object.assign(
      { 'Content-Type':'application/json' },
      TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}
    ),
    body: opciones.body ? JSON.stringify(opciones.body) : undefined
  });
  var d = await r.json().catch(function(){ return {}; });
  // Un 401 en el login NO es una sesion vencida: es la clave mal.
  // Antes se mezclaban y la pantalla decia "Sesion vencida" cuando en
  // realidad la clave no coincidia, que manda a buscar el problema
  // exactamente al lugar equivocado.
  if (r.status === 401 && ruta !== 'login') {
    salir();
    throw new Error('Sesion vencida');
  }
  if (!r.ok || d.ok === false) throw new Error(d.error || ('Error ' + r.status));
  return d;
}

// ── login ─────────────────────────────────────────────────────────
$('fLogin').addEventListener('submit', async function(e){
  e.preventDefault();
  var b = $('btnLogin'); b.disabled = true; $('errLogin').textContent = '';
  try {
    var d = await api('login', { method:'POST', body:{ rol:'panel', clave: $('clave').value } });
    TOKEN = d.token;
    sessionStorage.setItem('k24_despacho_token', TOKEN);
    entrar();
  } catch (err) {
    $('errLogin').textContent = err.message;
  } finally { b.disabled = false; }
});

function salir(){
  TOKEN = null;
  sessionStorage.removeItem('k24_despacho_token');
  clearInterval(timer);
  $('app').style.display='none';
  $('login').style.display='flex';
}
$('btnSalir').addEventListener('click', salir);

function entrar(){
  $('login').style.display='none';
  $('app').style.display='block';
  pintarSonido();
  refrescar();
  timer = setInterval(refrescar, 5000);
}

// ── alerta sonora ─────────────────────────────────────────────────
// Sin archivo de audio: se genera un bip con WebAudio.
function bip(){
  if (!sonido) return;
  try {
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(function(t){
      var o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.15);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.16);
    });
  } catch(e){}
}
function pintarSonido(){ $('btnSonido').textContent = sonido ? '🔔' : '🔕'; }
$('btnSonido').addEventListener('click', function(){
  sonido = !sonido;
  localStorage.setItem('k24_despacho_sonido', sonido ? '1' : '0');
  pintarSonido();
  if (sonido) bip();
});

// ── ciclo principal ───────────────────────────────────────────────
var repartidoresCache = [];
var puntosCache = [];
var colaCache = [];
var sugerencias = {};   // pedido_id -> mejor punto sugerido

async function refrescar(){
  try {
    var d = await api('cola');
    repartidoresCache = d.repartidores || [];
    colaCache = d.cola || [];
    pintarResumen(d.resumen);
    pintarCola(colaCache);
    pintarRepartidores(repartidoresCache);
    cargarPuntos();
    sugerirPuntos(colaCache);
    $('lat').textContent = 'en vivo · ' + new Date().toLocaleTimeString('es-AR');
    $('aviso').innerHTML = '';
  } catch (err) {
    $('lat').textContent = 'sin conexion';
    if (!/Sesion vencida/.test(err.message)) {
      $('aviso').innerHTML = '<div class="aviso">No se pudo actualizar: ' + esc(err.message) + '</div>';
    }
  }
}

function pintarResumen(r){
  r = r || {};
  $('sCola').textContent = r.en_cola || 0;
  $('sHoy').textContent  = r.pedidos_hoy || 0;
  $('sEnt').textContent  = r.entregados_hoy || 0;
  $('sFac').textContent  = pesos(r.facturado_hoy);
}

function pintarCola(cola){
  // Detectar pedidos nuevos para el bip
  var hayNuevo = false;
  cola.forEach(function(p){
    if (!conocidos.has(p.id)) {
      conocidos.add(p.id);
      if (!primeraCarga && p.estado === 'nuevo') hayNuevo = true;
    }
  });
  if (hayNuevo) { bip(); toast('Entró un pedido nuevo'); }
  primeraCarga = false;

  var html = '';
  ESTADOS.forEach(function(col){
    var dentro = cola.filter(function(p){ return p.estado === col.id; });
    html += '<div class="col"><h2>' + col.tit + ' <i>' + dentro.length + '</i></h2><div class="col-body">';
    html += dentro.length
      ? dentro.map(function(p){ return tarjeta(p, col); }).join('')
      : '<div class="vacio">—</div>';
    html += '</div></div>';
  });
  $('cols').innerHTML = html;
}

function tarjeta(p, col){
  var seg = p.segundos_desde_creado || 0;
  var clase = seg > 3600 ? 'grave' : (seg > 1800 ? 'alerta' : '');

  var items = (p.items || []).map(function(i){
    return '<div><span>' + i.qty + '× ' + esc(i.nombre) + (i.size ? ' ' + esc(i.size) : '') +
           '</span><span>' + pesos(i.qty * i.precio) + '</span></div>';
  }).join('');

  var h = '<div class="ped e-' + p.estado + '" data-id="' + p.id + '">';
  h += '<div class="ped-top"><span class="cod">' + esc(p.codigo) + '</span>' +
       '<span class="tiempo ' + clase + '">' + minutos(seg) + '</span></div>';

  if (p.punto_nombre) h += '<div class="punto-tag">🏪 ' + esc(p.punto_nombre) + '</div>';
  if (p.repartidor_nombre) h += '<div class="rep-tag">🛵 ' + esc(p.repartidor_nombre) + '</div>';
  if (p.sin_ubicar) h += '<div class="sin-ubicar">⚠ sin ubicación</div>';

  h += '<div class="dir">📍 ' + esc(p.direccion) + '</div>';
  if (p.direccion_notas) h += '<div class="meta">' + esc(p.direccion_notas) + '</div>';
  h += '<div class="meta">' + esc(p.cliente_nombre || 'Sin nombre');
  if (p.cliente_telefono) {
    h += ' · <a href="https://wa.me/' + esc(String(p.cliente_telefono).replace(/\D/g,'')) +
         '" target="_blank" rel="noopener" style="color:#22d3ee">' + esc(p.cliente_telefono) + '</a>';
  }
  h += '</div>';

  if (items) h += '<div class="items">' + items + '</div>';

  h += '<div class="tot"><span>Total' + (p.envio ? ' (envío ' + pesos(p.envio) + ')' : '') + '</span>' +
       '<span>' + pesos(p.total) + '</span></div>';
  h += '<div style="margin-bottom:9px"><span class="pago' + (p.pagado ? ' ok' : '') + '">' +
       esc(p.metodo_pago || 'sin definir') + (p.pagado ? ' · pagado' : '') + '</span></div>';

  // ── sugerencia de punto ──
  var sug = sugerencias[p.id];
  if (!p.punto_id && sug) {
    h += '<div class="sug">Sugerido: <b>' + esc(sug.nombre) + '</b>' +
         (sug.km_al_cliente != null ? ' · ' + sug.km_al_cliente + ' km' : '') +
         (sug.abierto ? '' : ' (cerrado)') + '</div>';
  }

  // ── acciones ──
  h += '<div class="acc">';

  // Elegir donde se prepara: disponible hasta que sale a la calle
  if (['nuevo','confirmado','preparando','asignado'].indexOf(p.estado) !== -1) {
    h += '<select onchange="elegirPunto(' + p.id + ', this.value); this.selectedIndex=0">';
    h += '<option value="">🏪 ' + (p.punto_id ? 'Cambiar punto…' : 'Dónde se prepara…') + '</option>';
    puntosCache.forEach(function(pt){
      if (!pt.activo || pt.id === p.punto_id) return;
      var km = (sug && sug.todos) ? sug.todos[pt.id] : null;
      h += '<option value="' + pt.id + '">' + esc(pt.nombre) +
           (km != null ? ' · ' + km + ' km' : '') +
           (pt.abierto_ahora ? '' : ' (cerrado)') + '</option>';
    });
    if (p.punto_id) h += '<option value="__quitar">✕ Quitar punto</option>';
    h += '</select>';
  }

  if (p.punto_id) {
    h += '<button class="btn btn-s btn-g" onclick="verLista(' + p.id + ')">📋 Lista</button>';
  }

  // Avisarle al cliente por WhatsApp con el link de seguimiento ya armado.
  // Se escribe a mano una sola vez y despues es un clic: el link lleva el
  // token del pedido, asi que no hay forma de mandarle a alguien el
  // seguimiento de otro.
  if (p.cliente_telefono && p.token_seguimiento) {
    h += '<button class="btn btn-s btn-g" onclick="avisar(' + p.id + ')">💬 Avisar</button>';
  }

  col.sig.forEach(function(s){
    h += '<button class="btn btn-s" onclick="cambiar(' + p.id + ',\'' + s + '\')">→ ' + NOMBRE[s] + '</button>';
  });

  // Asignar repartidor: disponible mientras no salio a la calle
  if (['nuevo','confirmado','preparando','asignado'].indexOf(p.estado) !== -1) {
    h += '<select onchange="asignar(' + p.id + ', this.value); this.selectedIndex=0">';
    h += '<option value="">🛵 Asignar…</option>';
    repartidoresCache.forEach(function(r){
      if (r.id === p.repartidor_id) return;
      h += '<option value="' + r.id + '">' + esc(r.nombre) + (r.en_turno ? ' ✓' : ' (sin turno)') + '</option>';
    });
    if (p.repartidor_id) h += '<option value="__quitar">✕ Quitar</option>';
    h += '</select>';
  }

  h += '<button class="btn btn-s btn-g" onclick="cancelar(' + p.id + ')">✕</button>';
  h += '</div></div>';
  return h;
}

function pintarRepartidores(reps){
  if (!reps.length) {
    $('reps').innerHTML = '<div class="vacio">No hay repartidores cargados. Ver LEEME.md, paso 4.</div>';
    return;
  }
  $('reps').innerHTML = reps.map(function(r){
    var visto = r.ultima_pos_at
      ? Math.round((Date.now() - new Date(r.ultima_pos_at).getTime())/60000) + ' min'
      : 'sin señal';
    return '<div class="rep' + (r.en_turno ? ' turno' : '') + '"><span class="luz"></span>' +
           '<span>' + esc(r.nombre) + '<br><small>' + (r.en_turno ? 'en turno · ' + visto : 'fuera de turno') + '</small></span></div>';
  }).join('');
}

// ── puntos de preparación ─────────────────────────────────────────
async function cargarPuntos(){
  try {
    var d = await api('puntos');
    puntosCache = d.puntos || [];
    pintarPuntos();
  } catch (e) { /* no bloquea la cola */ }
}

function pintarPuntos(){
  if (!puntosCache.length) {
    $('puntos').innerHTML = '<div class="vacio">Todavía no cargaste ningún punto. ' +
      'Sin puntos, los pedidos no tienen dónde prepararse.</div>';
    return;
  }
  var abiertos = puntosCache.filter(function(p){ return p.activo && p.abierto_ahora; }).length;
  var h = '';
  if (!abiertos) {
    h += '<div class="aviso">⚠ Ahora mismo no hay ningún punto abierto. ' +
         'Los pedidos que entren no se van a poder preparar hasta que abra alguno.</div>';
  }
  h += '<table class="tabla-p"><tr><th></th><th>Punto</th><th>Tipo</th><th>Radio</th><th>Horario</th><th></th></tr>';
  puntosCache.forEach(function(p){
    var hor = p.es_24h ? '24 horas'
            : (p.desde ? p.desde + '–' + p.hasta : 'sin horario');
    if (!p.horario_uniforme) hor += ' *';
    h += '<tr' + (p.activo ? '' : ' style="opacity:.45"') + '>' +
      '<td><span class="luz-p' + (p.abierto_ahora ? ' on' : '') + '"></span></td>' +
      '<td>' + esc(p.nombre) + '<br><small style="color:var(--muted)">' + esc(p.direccion) + '</small></td>' +
      '<td>' + ({mami:'Mami', kiosco_adherido:'Kiosco', propio:'Propio'}[p.tipo] || p.tipo) + '</td>' +
      '<td>' + p.radio_km + ' km</td>' +
      '<td>' + hor + '<br><small style="color:var(--muted)">' +
        (p.abierto_ahora ? 'abierto ahora' : 'cerrado ahora') + '</small></td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn btn-g btn-s" onclick="editarPunto(\'' + p.id + '\')">Editar</button> ' +
        '<button class="btn btn-g btn-s" onclick="togglePunto(\'' + p.id + '\',' + (!p.activo) + ')">' +
          (p.activo ? 'Desactivar' : 'Activar') + '</button>' +
      '</td>' +
    '</tr>';
  });
  h += '</table>';
  if (puntosCache.some(function(p){ return !p.horario_uniforme; })) {
    h += '<div class="sug" style="margin-top:10px">* Este punto tiene horarios distintos según el día. ' +
         'Si lo editás desde acá, se le aplica el mismo horario a los siete días.</div>';
  }
  $('puntos').innerHTML = h;
}

// Pide las sugerencias de punto para los pedidos que todavía no lo tienen.
async function sugerirPuntos(cola){
  var pendientes = cola.filter(function(p){ return !p.punto_id && !p.sin_ubicar; });
  for (var i = 0; i < pendientes.length; i++) {
    var p = pendientes[i];
    if (sugerencias[p.id]) continue;         // ya la tenemos
    try {
      var d = await api('puntos?pedido_id=' + p.id);
      var cands = (d.candidatos || []).filter(function(c){ return c.abierto && c.dentro_del_radio; });
      var mejor = cands[0] || (d.candidatos || [])[0];
      if (mejor) {
        var todos = {};
        (d.candidatos || []).forEach(function(c){ todos[c.punto_id] = c.km_al_cliente; });
        sugerencias[p.id] = { nombre: mejor.nombre, id: mejor.punto_id,
                              km_al_cliente: mejor.km_al_cliente, abierto: mejor.abierto, todos: todos };
      }
    } catch (e) { /* silencio */ }
  }
}

window.elegirPunto = async function(pedidoId, valor){
  if (!valor) return;
  try {
    await api('estado', { method:'POST',
      body:{ pedido_id: pedidoId, punto_id: valor === '__quitar' ? null : valor } });
    toast(valor === '__quitar' ? 'Punto quitado' : 'Punto asignado');
    delete sugerencias[pedidoId];
    refrescar();
  } catch (e) { toast('⚠ ' + e.message); }
};

window.togglePunto = async function(id, activar){
  try {
    await api('puntos', { method:'POST', body:{ id: id, activo: activar } });
    toast(activar ? 'Punto activado' : 'Punto desactivado');
    cargarPuntos();
  } catch (e) { toast('⚠ ' + e.message); }
};

// ── lista para pasarle a la sucursal ──────────────────────────────
// Sin datos del cliente: solo qué hay que juntar.
var listaActual = { texto:'', telefono:'' };

window.verLista = function(pedidoId){
  var p = colaCache.filter(function(x){ return x.id === pedidoId; })[0];
  if (!p) return;
  var t = 'Pedido ' + p.codigo + '\n';
  t += p.punto_nombre ? ('Preparar en: ' + p.punto_nombre + '\n') : '';
  t += '─────────────\n';
  (p.items || []).forEach(function(i){
    t += '• ' + i.qty + ' × ' + i.nombre + (i.size ? ' ' + i.size : '') +
         '   ' + pesos(i.qty * i.precio) + '\n';
  });
  t += '─────────────\n';
  // El subtotal es solo mercadería: el envío no es asunto del nodo.
  t += 'Productos: ' + pesos(p.subtotal) + '\n';
  t += 'Items: ' + (p.items || []).reduce(function(a,i){ return a + i.qty; }, 0);
  listaActual = { texto: t, telefono: String(p.punto_telefono || '').replace(/\D/g,'') };
  $('listaTexto').textContent = t;
  $('btnWspNodo').style.display = listaActual.telefono ? '' : 'none';
  abrirModal('mLista');
};

// ── Avisarle al cliente que su pedido esta en marcha ─────────────────────
//
// Abre WhatsApp con el mensaje ya escrito y el link de seguimiento del
// pedido. El link lleva el token unico, asi que cada cliente ve solo lo
// suyo.
//
// Se le habla de usted-vos como en el resto del sitio, y se le adelanta
// que el repartidor puede llamarlo: si no, la llamada de un numero
// desconocido asusta y a veces no la atienden.
window.avisar = function(pedidoId){
  var p = colaCache.filter(function(x){ return x.id === pedidoId; })[0];
  if (!p || !p.token_seguimiento) return;

  var tel = String(p.cliente_telefono || '').replace(/\D/g, '');
  if (!tel) { toast('Este pedido no tiene teléfono'); return; }
  // WhatsApp necesita el pais. Si el numero viene sin 54, se lo agregamos.
  if (tel.length === 10) tel = '549' + tel;
  else if (tel.indexOf('54') !== 0) tel = '54' + tel;

  var nombre = (p.cliente_nombre || '').trim().split(' ')[0];
  var link = 'https://k24hs.com/seguimiento.html?t=' + p.token_seguimiento;

  var m = '';
  m += nombre ? ('¡Hola ' + nombre + '! 👋\n\n') : '¡Hola! 👋\n\n';
  m += 'Recibimos tu pedido *' + p.codigo + '* y ya lo estamos preparando.\n\n';
  m += 'Podés seguirlo en vivo acá:\n' + link + '\n\n';

  if (p.metodo_pago === 'efectivo') {
    m += '💵 Total a pagar al recibir: ' + pesos(p.total) + '\n';
    if (p.paga_con) {
      m += 'Abonás con ' + pesos(p.paga_con) + ', el repartidor lleva el vuelto.\n';
    }
    m += '\n';
  }

  m += 'El repartidor puede llamarte para ubicarte más rápido.\n\n';
  m += 'Cualquier cosa respondé este mensaje. ¡Gracias por elegirnos! 🛵';

  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(m), '_blank');
};

$('btnCopiar').addEventListener('click', async function(){
  try {
    await navigator.clipboard.writeText(listaActual.texto);
    toast('Lista copiada');
  } catch (e) {
    // Si el navegador no deja usar el portapapeles, seleccionamos el texto
    var r = document.createRange(); r.selectNodeContents($('listaTexto'));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    toast('Copiala con Ctrl+C');
  }
});

$('btnWspNodo').addEventListener('click', function(){
  if (!listaActual.telefono) return;
  window.open('https://wa.me/' + listaActual.telefono + '?text=' +
              encodeURIComponent(listaActual.texto), '_blank');
});

// ── alta de punto ─────────────────────────────────────────────────
function abrirModal(id){ $(id).classList.add('ver'); }
window.cerrarModal = function(id){ $(id).classList.remove('ver'); };

var editandoId = null;   // null = alta, uuid = edición

// El check de 24 horas y los campos de hora son lo mismo por debajo:
// 24hs se guarda como desde = hasta.
$('p24').addEventListener('change', function(){
  $('horarioNormal').style.display = this.checked ? 'none' : 'grid';
});

function abrirFormPunto(punto){
  editandoId = punto ? punto.id : null;
  $('errPunto').textContent = '';
  $('tituloPunto').textContent = punto ? 'Editar punto' : 'Nuevo punto de preparación';
  $('btnGuardarPunto').textContent = punto ? 'Guardar cambios' : 'Guardar';

  $('pNombre').value = punto ? punto.nombre : '';
  $('pTipo').value   = punto ? punto.tipo : 'mami';
  $('pDir').value    = punto ? punto.direccion : '';
  $('pRadio').value  = punto ? punto.radio_km : 5;
  $('pTel').value    = punto ? (punto.telefono || '') : '';

  var es24 = punto ? !!punto.es_24h : false;
  $('p24').checked = es24;
  $('horarioNormal').style.display = es24 ? 'none' : 'grid';
  $('pDesde').value = (punto && punto.desde && !es24) ? punto.desde : '08:00';
  $('pHasta').value = (punto && punto.hasta && !es24) ? punto.hasta : '21:00';

  $('avisoHorario').textContent = (punto && !punto.horario_uniforme)
    ? 'Ojo: este punto tiene horarios distintos según el día. Si guardás, se le aplica el mismo a los siete.'
    : '';

  abrirModal('mPunto');
}

$('btnNuevoPunto').addEventListener('click', function(){ abrirFormPunto(null); });

window.editarPunto = function(id){
  var p = puntosCache.filter(function(x){ return x.id === id; })[0];
  if (p) abrirFormPunto(p);
};

$('btnGuardarPunto').addEventListener('click', async function(){
  var b = $('btnGuardarPunto');
  var nombre = $('pNombre').value.trim();
  var dir = $('pDir').value.trim();
  if (!nombre || !dir) { $('errPunto').textContent = 'Falta el nombre o la dirección'; return; }

  b.disabled = true;
  $('errPunto').textContent = 'Ubicando la dirección…';

  // 24 horas se expresa como desde = hasta
  var desde = $('p24').checked ? '00:00' : $('pDesde').value;
  var hasta = $('p24').checked ? '00:00' : $('pHasta').value;

  var cuerpo = {
    nombre: nombre,
    tipo: $('pTipo').value,
    direccion: dir,
    desde: desde,
    hasta: hasta,
    radio_km: Number($('pRadio').value) || 5,
    telefono: $('pTel').value.trim()
  };
  if (editandoId) cuerpo.id = editandoId;

  try {
    await api('puntos', { method:'POST', body: cuerpo });
    toast(editandoId ? 'Punto actualizado' : 'Punto creado');
    cerrarModal('mPunto');
    editandoId = null;
    sugerencias = {};     // las distancias cambian si se movió el punto
    cargarPuntos();
    refrescar();
  } catch (e) {
    $('errPunto').textContent = e.message;
  } finally { b.disabled = false; }
});

// ── acciones ──────────────────────────────────────────────────────
window.cambiar = async function(id, estado){
  var extra = {};
  if (estado === 'entregado') {
    var quien = prompt('¿Quién recibió el pedido? (opcional)');
    if (quien === null) return;
    if (quien.trim()) extra.receptor = quien.trim();
    extra.pagado = confirm('¿Se cobró el pedido?');
  }
  try {
    await api('estado', { method:'POST', body: Object.assign({ pedido_id:id, estado:estado }, extra) });
    toast('Pedido → ' + NOMBRE[estado]);
    refrescar();
  } catch (e) { toast('⚠ ' + e.message); }
};

window.asignar = async function(id, valor){
  if (!valor) return;
  try {
    await api('estado', { method:'POST',
      body: { pedido_id:id, repartidor_id: valor === '__quitar' ? null : valor } });
    toast(valor === '__quitar' ? 'Repartidor quitado' : 'Repartidor asignado');
    refrescar();
  } catch (e) { toast('⚠ ' + e.message); }
};

window.cancelar = async function(id){
  var motivo = prompt('Motivo de la cancelación:');
  if (motivo === null) return;
  if (!motivo.trim()) { toast('Hace falta un motivo'); return; }
  try {
    await api('estado', { method:'POST', body:{ pedido_id:id, estado:'cancelado', motivo:motivo.trim() } });
    toast('Pedido cancelado');
    refrescar();
  } catch (e) { toast('⚠ ' + e.message); }
};

// Pausar el refresco si la pestaña no esta visible: ahorra llamadas
document.addEventListener('visibilitychange', function(){
  if (!TOKEN) return;
  clearInterval(timer);
  if (!document.hidden) { refrescar(); timer = setInterval(refrescar, 5000); }
  else { timer = setInterval(refrescar, 30000); }
});

if (TOKEN) entrar();
</script>
